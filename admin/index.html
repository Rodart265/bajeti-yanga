<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#102a35"><meta name="robots" content="noindex,nofollow">
<title>Bajeti Yanga Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./admin.css">
</head>
<body>
<div id="loginView" class="login-wrap">
  <div class="login-card">
    <img class="brand-mark" src="../icons/icon-192.png" width="46" height="46" alt="">
    <p class="eyebrow">Bajeti Yanga</p>
    <h1>Admin console</h1>
    <p class="muted">A private workspace for running the platform.</p>
    <button id="googleLogin" class="btn primary wide" type="button">Continue with Google</button>
    <p id="loginError" class="error" role="alert"></p>
    <p class="fine">Only Google accounts on the admin list can enter. Every change you make is written to the activity log.</p>
    <a href="../index.html" class="back-link">Back to Bajeti Yanga</a>
  </div>
</div>

<div id="appView" class="shell" hidden>
  <aside id="sidebar" class="sidebar" aria-label="Main menu">
    <a class="side-brand" href="./"><img class="brand-mark small" src="../icons/icon-192.png" width="36" height="36" alt=""><span><b>Bajeti Yanga</b><small>ADMIN CONSOLE</small></span></a>
    <div class="nav-label">WORKSPACE</div>
    <nav id="nav" class="nav"></nav>
    <div class="side-bottom">
      <div class="who"><span id="whoEmail"></span><small id="whoRole"></small></div>
      <button id="signOut" class="nav-item" type="button"><svg class="i" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>Sign out</button>
    </div>
  </aside>
  <div id="scrim" class="scrim" hidden></div>
  <div class="main">
    <header class="topbar">
      <button id="menuBtn" class="icon-btn menu-btn" type="button" aria-label="Open menu"><svg class="i" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      <h1 id="pageTitle">Overview</h1>
      <span class="spacer"></span>
      <span id="roleChip" class="role-chip"></span>
    </header>
    <main id="view" class="content" tabindex="-1"></main>
  </div>
</div>

<div id="drawerScrim" class="drawer-scrim" hidden></div>
<aside id="drawer" class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle" hidden>
  <div class="drawer-head"><div><p id="drawerEyebrow" class="eyebrow"></p><h2 id="drawerTitle"></h2></div><button id="drawerClose" class="icon-btn" type="button" aria-label="Close"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div id="drawerBody" class="drawer-body"></div>
</aside>
<div id="tip" class="tip" hidden></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="./admin.js"></script>
</body>
</html>
